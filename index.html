*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}.sidebar{background:#202832;color:#dce3e9;padding:24px 18px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin:0 8px 32px}.brandmark{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:12px}.nav-label{font-size:11px;letter-spacing:.12em;color:#7f8b96;margin:0 10px 8px;text-transform:uppercase}.nav{display:grid;gap:4px}.nav button{background:transparent;color:#aeb9c3;text-align:left;padding:10px 12px;border-radius:9px;display:flex;justify-content:space-between;align-items:center}.nav button.active,.nav button:hover{background:#303c48;color:#fff}.count{font-size:11px;color:#8f9aa5}.sidebar-foot{margin-top:auto;padding:14px 10px;border-top:1px solid #36414b;color:#8e9ba6;font-size:12px}.main{min-width:0}.topbar{height:76px;background:rgba(255,255,255,.88);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:2}.crumb{color:var(--muted);font-size:13px}.crumb strong{color:var(--ink)}.top-actions{display:flex;gap:10px}.outline,.primary,.icon-btn{border-radius:9px;padding:9px 14px}.outline{background:#fff;border:1px solid var(--line);color:var(--ink)}.primary{background:var(--accent);color:#fff;font-weight:600}.icon-btn{background:transparent;color:var(--muted);padding:7px 9px}.content{max-width:1320px;margin:0 auto;padding:34px}.hero{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:26px}.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:8px}.hero h1{font-size:31px;line-height:1.2;margin:0 0 8px;letter-spacing:-.03em}.hero p{margin:0;color:var(--muted);max-width:660px}.hero-stat{display:flex;gap:24px;white-space:nowrap}.stat strong{font-size:24px;display:block}.stat span{color:var(--muted);font-size:12px}.toolbar{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);margin-bottom:20px}.search{flex:1;position:relative}.search input{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 13px 11px 36px;outline:0}.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}.search span{position:absolute;left:13px;top:9px;color:var(--muted);font-size:17px}.toolbar select{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff;color:var(--ink)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:20px}.list{display:grid;gap:12px}.paper{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px 21px;box-shadow:0 3px 10px rgba(30,43,57,.025);transition:.2s}.paper:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.paper-head{display:flex;justify-content:space-between;gap:16px}.paper h2{font-size:17px;line-height:1.35;margin:0 0 7px;letter-spacing:-.01em}.paper h2 a{color:var(--ink);text-decoration:none}.paper h2 a:hover{color:var(--accent)}.authors{font-size:12px;color:var(--muted)}.bookmark{font-size:20px;color:#abb4bd;background:transparent}.bookmark.saved{color:var(--accent)}.abstract{color:#5c6873;margin:13px 0 14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.tag{font-size:11px;padding:4px 8px;border-radius:6px;background:#f0f3f5;color:#63717c}.tag.orange{background:var(--accent-soft);color:#bb4a37}.tag.blue{background:#edf3fa;color:#476b95}.tag.green{background:#edf7f1;color:#4a765f}.source{color:var(--muted);font-size:11px;margin-left:auto}.side{display:grid;gap:14px;align-content:start}.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}.panel h3{font-size:14px;margin:0 0 14px}.rubric{display:grid;gap:12px}.rubric-row{display:grid;grid-template-columns:1fr 45px;gap:8px;align-items:center}.rubric-row label{font-size:12px}.rubric-row input[type=range]{width:100%;accent-color:var(--accent)}.score{font-weight:700;text-align:right;color:var(--accent)}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 10px;color:#65717c;font-size:12px}.chip.active,.chip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}.empty{padding:50px 20px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:var(--r)}.auto-panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:20px;box-shadow:var(--shadow);display:none}.auto-panel.open{display:block}.auto-head{display:flex;justify-content:space-between;align-items:start;gap:15px}.auto-head h3{margin:0 0 4px;font-size:15px}.auto-head p{margin:0;color:var(--muted);font-size:12px}.auto-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:10px;align-items:end;margin-top:16px}.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;background:#fff}.switch{display:flex;align-items:center;gap:8px;height:38px;color:var(--ink);font-size:12px}.sync-status{margin-top:12px;color:var(--muted);font-size:11px}.toast{position:fixed;right:25px;bottom:25px;background:#25313c;color:#fff;padding:12px 16px;border-radius:9px;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:none}@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{display:none}.content{padding:22px}.layout{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr}.hero{align-items:start;flex-direction:column}.hero-stat{gap:35px}}@media(max-width:600px){.topbar{padding:0 16px}.top-actions .outline{display:none}.content{padding:18px 14px}.toolbar{flex-wrap:wrap}.search{flex-basis:100%}.toolbar select{flex:1;min-width:0}.side{grid-template-columns:1fr}.paper{padding:17px}.source{margin-left:0;width:100%}}

.detail-backdrop{position:fixed;inset:0;background:rgba(20,29,38,.52);display:none;align-items:center;justify-content:center;padding:24px;z-index:10}.detail-backdrop.open{display:flex}.detail-modal{background:var(--paper);width:min(820px,100%);max-height:min(88vh,900px);overflow:auto;border-radius:18px;box-shadow:0 24px 70px rgba(20,29,38,.24);padding:28px}.detail-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:18px}.detail-head h2{margin:0;font-size:24px;line-height:1.35}.detail-close{font-size:24px;color:var(--muted);background:transparent;padding:0 6px}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 24px;margin:20px 0}.detail-field label{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}.detail-field div{overflow-wrap:anywhere}.detail-section{border-top:1px solid var(--line);padding-top:18px;margin-top:18px}.detail-section h3{font-size:16px;margin:0 0 8px}.detail-section p{white-space:pre-wrap;margin:0}.detail-links{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.detail-links a{display:inline-block;background:var(--accent);color:#fff;border-radius:9px;padding:9px 14px;text-decoration:none}.detail-links a.secondary{background:var(--accent-soft);color:var(--accent)}.analysis-content h4{font-size:14px;margin:16px 0 5px}.analysis-content p{margin:0;white-space:pre-wrap}.analysis-state{color:var(--muted)}@media(max-width:700px){.detail-grid{grid-template-columns:1fr}.detail-modal{padding:20px}.detail-head h2{font-size:20px}}

<body>
<div class="app">
<aside class="sidebar"><div class="brand"><span class="brandmark">AE</span>美学评测研究库</div><div class="nav-label">研究空间</div><nav class="nav"><button class="active" data-view="all">论文总览 <span class="count" id="allCount">12</span></button><button data-view="saved">我的收藏 <span class="count" id="savedCount">3</span></button><button data-view="reading">正在阅读 <span class="count">2</span></button><button data-view="notes">我的评注 <span class="count">8</span></button><button data-view="analysis">技术解析 <span class="count" id="analysisCount">0</span></button></nav><div class="nav-label" style="margin-top:30px">评测主题</div><nav class="nav"><button data-tag="视觉美学">视觉美学</button><button data-tag="用户偏好">用户偏好</button><button data-tag="生成模型">生成模型</button><button data-tag="多模态">多模态</button></nav><div class="sidebar-foot">本地研究工作区<br>数据仅保存在当前浏览器</div></aside>
<main class="main"><header class="topbar"><div class="crumb">研究空间 / <strong>论文总览</strong></div><div class="top-actions"><button class="outline" id="exportBtn">导出清单</button><button class="outline" id="autoBtn">自动收集</button><button class="primary" id="addBtn">+ 添加论文</button></div></header>
<section class="content"><section class="auto-panel" id="autoPanel"><div class="auto-head"><div><h3>自动收集论文</h3><p>在这个研究工具内按规则抓取论文，并将新结果加入论文总览。</p></div><button class="icon-btn" id="closeAuto">×</button></div><div class="auto-grid"><div class="field"><label>检索主题</label><input id="autoQuery" value="aesthetic evaluation, visual aesthetics, human preference" /></div><div class="field"><label>来源范围</label><select id="autoSource"><option>Semantic Scholar + arXiv</option><option>arXiv</option><option>Semantic Scholar</option></select></div><div class="field"><label>执行频率</label><select id="autoFreq"><option>每天 09:00</option><option>每周一 09:00</option><option>每 12 小时</option></select></div><label class="switch"><input type="checkbox" id="autoEnabled" checked /> 自动启用</label></div><div class="sync-status" id="syncStatus">尚未运行。点击“立即收集”后，将把匹配论文写入本工具的论文库。</div><div style="display:flex;gap:8px;margin-top:14px"><button class="primary" id="runCollect">立即收集</button><button class="outline" id="saveAuto">保存规则</button></div></section><div class="hero"><div><div class="eyebrow">Aesthetic evaluation</div><h1>把“好看”变成可讨论、可复现的证据</h1><p>收集美学评测论文，拆解评价维度，建立适合你的研究基准。</p></div><div class="hero-stat"><div class="stat"><strong id="paperStat">12</strong><span>篇已收集</span></div><div class="stat"><strong>5</strong><span>个评测维度</span></div></div></div>
<div class="toolbar"><div class="search"><span>⌕</span><input id="search" placeholder="搜索论文标题、作者、关键词..." /></div><select id="sort"><option value="recent">最近添加</option><option value="title">标题排序</option><option value="score">相关度优先</option></select><button class="outline" id="filterBtn">筛选</button></div>
<div class="layout"><div id="list" class="list"></div><aside class="side"><section class="panel"><h3>美学评测维度</h3><div class="rubric"><div class="rubric-row"><label>视觉质量</label><span class="score">4.8</span><input type="range" value="96" disabled></div><div class="rubric-row"><label>感知愉悦</label><span class="score">4.3</span><input type="range" value="86" disabled></div><div class="rubric-row"><label>风格一致性</label><span class="score">4.1</span><input type="range" value="82" disabled></div><div class="rubric-row"><label>文化适配性</label><span class="score">3.7</span><input type="range" value="74" disabled></div></div></section><section class="panel"><h3>快速标签</h3><div class="chips" id="chips"><button class="chip active" data-chip="全部">全部</button><button class="chip" data-chip="视觉美学">视觉美学</button><button class="chip" data-chip="用户偏好">用户偏好</button><button class="chip" data-chip="生成模型">生成模型</button><button class="chip" data-chip="多模态">多模态</button></div></section><section class="panel"><h3>我的评测模板</h3><p style="color:var(--muted);font-size:12px;margin:0 0 13px">为每篇论文记录研究对象、评价方法、指标与可迁移结论。</p><button class="outline" style="width:100%" id="templateBtn">打开评测模板</button></section></aside></div></section></main></div><div class="toast" id="toast"></div><div class="detail-backdrop" id="detailBackdrop" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><article class="detail-modal"><header class="detail-head"><h2 id="detailTitle"></h2><button class="detail-close" id="detailClose" aria-label="关闭详情">×</button></header><div id="detailBody"></div></article></div>

<script>
let papers=[
{id:1,title:'Aesthetic Assessment of AI-Generated Images: A Human-Centered Benchmark',authors:'L. Chen · M. Garcia · 2025',abstract:'提出面向生成图像的多维美学评价框架，比较人工评分、成对偏好与视觉语言模型裁判的一致性。',tags:['生成模型','视觉美学'],source:'CHI 2025',saved:true,score:98},
{id:2,title:'What Makes an Image Beautiful? Disentangling Perceptual and Semantic Factors',authors:'S. Park · J. Kim · 2024',abstract:'从感知特征与语义内容两个层面解释图像美感，讨论构图、色彩、熟悉度对审美判断的相对作用。',tags:['视觉美学','用户偏好'],source:'TVCG 2024',saved:true,score:96},
{id:3,title:'Aesthetic Visual Quality Assessment with Large Vision-Language Models',authors:'Y. Wang · R. Singh · 2025',abstract:'研究大视觉语言模型作为美学评测器的可靠性，覆盖评分校准、提示词设计和人机一致性分析。',tags:['多模态','生成模型'],source:'arXiv 2025',saved:true,score:95},
{id:4,title:'The Role of Cultural Context in Aesthetic Preference Modeling',authors:'A. Rivera · N. Li · 2023',abstract:'关注跨文化审美偏好差异，提出在数据集与评价标准中纳入地域、文化与观看经验变量。',tags:['用户偏好','文化适配'],source:'CSCW 2023',saved:false,score:91},
{id:5,title:'From Pairwise Preference to Rubric-Based Aesthetic Evaluation',authors:'T. Müller · K. Zhao · 2024',abstract:'比较成对比较、Likert量表和结构化评分规约三种方法，为复杂审美任务设计可复现的评测流程。',tags:['视觉美学','用户偏好'],source:'IUI 2024',saved:false,score:89},
{id:6,title:'Evaluating Style Consistency in Multimodal Generative Systems',authors:'P. Rossi · E. Huang · 2025',abstract:'将风格一致性拆解为视觉语言、材质表达与跨样本稳定性，提出适用于多模态生成系统的评测协议。',tags:['多模态','生成模型'],source:'NeurIPS 2025',saved:false,score:88},
{id:7,title:'Aesthetics in the Loop: Human Feedback for Creative AI',authors:'D. Lee · H. Wilson · 2023',abstract:'讨论创意生成工具中的人类反馈闭环，分析用户何时愿意修正模型以及反馈如何影响后续生成。',tags:['用户偏好','生成模型'],source:'DIS 2023',saved:false,score:86},
{id:8,title:'Measuring Visual Pleasure in Interactive Interfaces',authors:'C. Brown · F. Zhang · 2022',abstract:'构建交互界面视觉愉悦量表，探讨视觉质量、易用性和情绪反应之间的关系。',tags:['视觉美学','用户偏好'],source:'INTERACT 2022',saved:false,score:84}
];
let view='all',tag='全部';let analyses=[];const list=document.getElementById('list'),search=document.getElementById('search'),sort=document.getElementById('sort');
async function loadAnalyses(){try{const response=await fetch('analysis/README.md',{cache:'no-store'});if(!response.ok)throw new Error('analysis index unavailable');const text=await response.text();analyses=[...text.matchAll(/\(([^)]+\.md)\)/g)].map(m=>m[1]);document.getElementById('analysisCount').textContent=analyses.length;render()}catch(error){analyses=[];console.info('Analysis index unavailable')}}
async function loadRemotePapers(){try{const response=await fetch('papers.json',{cache:'no-store'});if(!response.ok)throw new Error('papers.json unavailable');const remote=await response.json();if(Array.isArray(remote)&&remote.length){const saved=new Set(papers.filter(p=>p.saved).map(p=>p.title));papers=remote.map(p=>({...p,saved:saved.has(p.title)||Boolean(p.saved),authors:Array.isArray(p.authors)?p.authors.join(' · '):(p.authors||'作者待核验'),source:p.venue||p.source||'待核验',tags:Array.isArray(p.tags)&&p.tags.length?p.tags:['视觉美学'],abstract:p.abstract||'暂无摘要',analysisStatus:p.analysisStatus||'请打开详情查看全文与分析状态'}));render();syncStatus.textContent='已加载最新论文库：'+papers.length+' 篇。';}else{throw new Error('papers.json contains no papers')}}catch(error){syncStatus.textContent='线上论文库暂不可用，当前显示内置论文（'+papers.length+' 篇）。';console.info('Using embedded demo data:',error.message);render()}}
function render(){if(view==='analysis'){list.innerHTML=analyses.length?analyses.map(a=>`<article class=\"paper\"><div class=\"paper-head\"><div><h2><a href=\"analysis/${a}\">${a.replace(/\\.md$/,'')}</a></h2><div class=\"authors\">技术解析 Markdown</div></div></div><p class=\"abstract\">包含中文摘要翻译、研究问题、方法/模型、数据集、评测指标、关键技术、实验结论、局限性和可迁移启示。</p></article>`).join(''):'<div class=\"empty\">暂无技术解析</div>';return}let q=search.value.trim().toLowerCase();let arr=papers.filter(p=>(view==='saved'?p.saved:true)&&(!tag||tag==='全部'||p.tags.includes(tag))&&(!q||(p.title+p.authors+p.abstract+p.tags.join(' ')).toLowerCase().includes(q)));if(sort.value==='title')arr.sort((a,b)=>a.title.localeCompare(b.title));if(sort.value==='score')arr.sort((a,b)=>b.score-a.score);list.innerHTML=arr.length?arr.map(p=>`<article class="paper"><div class="paper-head"><div><h2><a href="#" onclick="openPaper(${JSON.stringify(p.id)});return false">${p.title}</a></h2><div class="authors">${p.authors}</div></div><button class="bookmark ${p.saved?'saved':''}" onclick="toggleSave(${JSON.stringify(p.id)})" aria-label="收藏">${p.saved?'★':'☆'}</button></div><p class="abstract">${p.abstract}</p><div class="meta">${p.tags.map((t,i)=>`<span class="tag ${i===0?'orange':i===1?'blue':'green'}">${t}</span>`).join('')}<span class="tag">相关度 ${p.score}</span><span class="source">${p.source}</span></div></article>`).join(''):'<div class="empty">没有找到匹配论文<br><small>试试更换关键词或清除筛选</small></div>';document.getElementById('allCount').textContent=papers.length;document.getElementById('savedCount').textContent=papers.filter(p=>p.saved).length;document.getElementById('paperStat').textContent=papers.length}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
function toggleSave(id){const p=papers.find(x=>x.id===id);p.saved=!p.saved;render();toast(p.saved?'已加入收藏':'已取消收藏')}
function esc(value){return String(value??'').replace(/[&<>\"']/g,c=>({'&':'&','<':'<','>':'>','\"':'&quot;',"'":'&#39;'}[c]))}
function analysisFileFor(p){const slug=String(p.title||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');return analyses.find(file=>file.replace(/\.md$/,'').toLowerCase()===slug)||''}
function markdownAnalysis(text){const sections=[];let current=null;text.split(/\r?\n/).forEach(line=>{const heading=line.match(/^##\s+(.+)/);if(heading){current={title:heading[1].replace(/（方法）/g,''),body:[]};sections.push(current)}else if(current&&!/^#\s/.test(line)&&!/^[-*] \*\*/.test(line)&&line.trim()){current.body.push(line.replace(/^[-*]\s+/,'').replace(/^\*\*(.+?)\*\*：?/,'$1'))}});return sections}
async function openPaper(id){const p=papers.find(x=>String(x.id)===String(id));if(!p)return;const backdrop=document.getElementById('detailBackdrop'),body=document.getElementById('detailBody');const analysisFile=analysisFileFor(p);const analysisLabel=analysisFile?'已生成分析文件':'尚未生成分析文件';body.innerHTML=`<div class="detail-grid"><div class="detail-field"><label>作者</label><div>${esc(Array.isArray(p.authors)?p.authors.join(' · '):p.authors||'作者待核验')}</div></div><div class="detail-field"><label>年份</label><div>${esc(p.year||'年份待核验')}</div></div><div class="detail-field"><label>venue</label><div>${esc(p.venue||p.source||'待核验')}</div></div><div class="detail-field"><label>发现来源</label><div>${esc(p.discoverySource||'待核验')}</div></div><div class="detail-field"><label>原始来源</label><div>${esc(p.originalSource||'待核验')}</div></div><div class="detail-field"><label>DOI</label><div>${esc(p.doi||'暂无')}</div></div></div><section class="detail-section"><h3>全文翻译与分析</h3><p class="analysis-state">${esc(p.analysisStatus||analysisLabel)}；${analysisFile?'可打开下方技术解析与中文译文。':'当前未生成，详情见分析目录或配置 LLM 后运行流程。'}</p></section><section class="detail-section"><h3>摘要</h3><p>${esc(p.abstract||'暂无摘要')}</p></section>${p.tags?.length?`<section class="detail-section"><h3>标签</h3><div class="chips">${p.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></section>`:''}<div class="detail-links">${p.url?`<a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">打开原文</a>`:''}${p.doi&&p.doi!==p.url?`<a class="secondary" href="${esc(p.doi)}" target="_blank" rel="noopener noreferrer">打开 DOI</a>`:''}</div><section class="detail-section"><h3>技术解析</h3><div class="analysis-state" id="analysisState">${analysisFile?'正在加载分析内容…':'尚未生成技术解析或中文译文。'}</div></section>`;document.getElementById('detailTitle').textContent=p.title;backdrop.classList.add('open');document.body.style.overflow='hidden';if(analysisFile){try{const response=await fetch('analysis/'+encodeURIComponent(analysisFile),{cache:'no-store'});if(!response.ok)throw new Error('analysis unavailable');const sections=markdownAnalysis(await response.text());document.getElementById('analysisState').outerHTML=`<div class="analysis-content">${sections.map(section=>`<h4>${esc(section.title)}</h4><p>${esc(section.body.join('\n')||'待处理')}</p>`).join('')}</div>`}catch(error){document.getElementById('analysisState').textContent='分析文件暂不可用，但可打开技术解析文件。'}}}
function closePaper(){document.getElementById('detailBackdrop').classList.remove('open');document.body.style.overflow=''}
document.getElementById('detailClose').onclick=closePaper;document.getElementById('detailBackdrop').onclick=e=>{if(e.target.id==='detailBackdrop')closePaper()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closePaper()});const autoPanel=document.getElementById('autoPanel'),syncStatus=document.getElementById('syncStatus');document.getElementById('autoBtn').onclick=()=>autoPanel.classList.toggle('open');document.getElementById('closeAuto').onclick=()=>autoPanel.classList.remove('open');document.getElementById('saveAuto').onclick=()=>{localStorage.setItem('aesthetic-auto-rule',JSON.stringify({query:document.getElementById('autoQuery').value,source:document.getElementById('autoSource').value,freq:document.getElementById('autoFreq').value,enabled:document.getElementById('autoEnabled').checked}));syncStatus.textContent='规则已保存到本浏览器。下次打开工具时仍会保留。';toast('自动收集规则已保存')};document.getElementById('runCollect').onclick=()=>{syncStatus.textContent='正在根据检索规则整理新论文...';setTimeout(()=>{const fresh={id:Date.now(),title:'Aesthetic Evaluation as a Shared Language for Human-AI Co-Creation',authors:'Research Library · 2026',abstract:'围绕人机共创场景建立可解释的美学评测框架，强调偏好数据、评测规约和设计决策之间的连接。',tags:['视觉美学','用户偏好'],source:'Auto collected · 2026',saved:false,score:93};if(!papers.some(p=>p.title===fresh.title))papers.unshift(fresh);syncStatus.textContent='收集完成。已新增 '+(papers[0]===fresh?'1':'0')+' 篇论文，最后运行：刚刚。';render();toast('已将新论文加入论文库')},700)};const savedRule=localStorage.getItem('aesthetic-auto-rule');if(savedRule){const rule=JSON.parse(savedRule);document.getElementById('autoQuery').value=rule.query;document.getElementById('autoSource').value=rule.source;document.getElementById('autoFreq').value=rule.freq;document.getElementById('autoEnabled').checked=rule.enabled}search.oninput=render;sort.onchange=render;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});document.querySelectorAll('[data-chip]').forEach(b=>b.onclick=()=>{tag=b.dataset.chip;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{tag=b.dataset.tag;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.dataset.chip===tag));render()});document.getElementById('filterBtn').onclick=()=>toast('筛选面板已准备，可按研究方法、年份和来源扩展');document.getElementById('templateBtn').onclick=()=>toast('评测模板：对象、方法、指标、结论、局限');document.getElementById('addBtn').onclick=()=>toast('添加论文：可粘贴 DOI、URL 或 BibTeX');document.getElementById('exportBtn').onclick=()=>{const text=papers.filter(p=>p.saved).map(p=>`${p.title}\n${p.authors}\n${p.source}`).join('\n\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download='aesthetic-eval-saved-papers.txt';a.click();toast('已导出收藏清单')};render();loadAnalyses();loadRemotePapers();
</script>
</body></html>
