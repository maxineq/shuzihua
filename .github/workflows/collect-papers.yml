name: Collect aesthetic evaluation papers

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Collect papers from OpenAlex
        env:
          PAPER_QUERY: '"aesthetic evaluation" OR "visual aesthetics" OR "human preference"'
          PAPER_LIMIT: "30"
          OPENALEX_MAILTO: ""
        run: python3 collect_papers.py
      - name: Commit updated paper data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers.json
          git diff --cached --quiet || git commit -m "chore: update paper collection"
          git push
