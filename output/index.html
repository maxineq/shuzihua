<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>腾讯公益机构平台 - 设计预览</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #f6f7f8;
      font-family: 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: rgba(0, 0, 0, 0.9);
    }
    .page {
      width: 1200px;
      margin: 0 auto;
      padding: 36px 0 64px;
    }
    .title {
      font-size: 28px;
      line-height: 36px;
      font-weight: 700;
      color: #4fbd67;
      margin-bottom: 10px;
    }
    .subtitle {
      font-size: 15px;
      line-height: 24px;
      color: rgba(0, 0, 0, 0.62);
      margin-bottom: 32px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }
    .card {
      display: block;
      min-height: 124px;
      padding: 24px;
      border-radius: 8px;
      background: #fff;
      color: inherit;
      text-decoration: none;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(0, 0, 0, 0.04);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      border-color: rgba(79, 189, 103, 0.28);
    }
    .card-title {
      font-size: 18px;
      line-height: 26px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .card-desc {
      min-height: 44px;
      font-size: 14px;
      line-height: 22px;
      color: rgba(0, 0, 0, 0.58);
      margin-bottom: 14px;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      height: 20px;
      padding: 0 8px;
      border-radius: 4px;
      background: rgba(79, 189, 103, 0.12);
      color: #4fbd67;
      font-size: 12px;
      font-weight: 600;
    }
    @media (max-width: 1240px) {
      .page { width: auto; padding: 32px 24px 56px; }
    }
    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
      .title { font-size: 24px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1 class="title">腾讯公益机构平台 - 设计预览</h1>
    <p class="subtitle">所有设计案例的实时预览入口</p>

    <section class="grid" aria-label="设计预览入口">
      <a class="card" href="./login.html" data-url="./login.html">
        <div class="card-title">登录页</div>
        <div class="card-desc">管理端登录页 - 毛玻璃卡片 + 短信/微信/QQ/企业微信登录</div>
        <span class="tag">ui</span>
      </a>

      <a class="card" href="./disbursement-wechat.html" data-url="./disbursement-wechat.html">
        <div class="card-title">微信拨付管理</div>
        <div class="card-desc">拨付单列表页 - Tab筛选、数据表格、状态圆点、操作链接、分页</div>
        <span class="tag">ui</span>
      </a>

      <a class="card" href="./dashboard.html" data-url="./dashboard.html">
        <div class="card-title">首页</div>
        <div class="card-desc">Dashboard首页 - 数据概览、常用功能、待办事项、排行榜</div>
        <span class="tag">ui</span>
      </a>

      <a class="card" href="./case-detail.html" data-url="./case-detail.html">
        <div class="card-title">受助人详情</div>
        <div class="card-desc">按Figma结构还原 - 基本信息、教育信息、走访记录、附件材料、审核记录</div>
        <span class="tag">ui</span>
      </a>
    </section>
  </main>

  <script>
    document.querySelectorAll('.card[data-url]').forEach((card) => {
      card.addEventListener('click', (event) => {
        event.preventDefault();
        window.location.assign(card.dataset.url);
      });
    });
  </script>
</body>
</html>
